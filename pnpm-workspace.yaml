overrides:
  'vue': 'rc'
  '@vue/compiler-core': 'rc'
  '@vue/compiler-dom': 'rc'
  '@vue/compiler-sfc': 'rc'
  '@vue/compiler-ssr': 'rc'
  '@vue/compiler-vapor': 'rc'
  '@vue/reactivity': 'rc'
  '@vue/runtime-core': 'rc'
  '@vue/runtime-dom': 'rc'
  '@vue/runtime-vapor': 'rc'
  '@vue/server-renderer': 'rc'
  '@vue/shared': 'rc'
  '@vue/compat': 'rc'
  'typescript': 'npm:typescript-native-bridge@latest'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - 'vue'
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vitest: 4.1.11
  vite-plus: 0.3.3
minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@0.3.3'
  - '@voidzero-dev/vite-plus-darwin-arm64@0.3.3'
  - '@voidzero-dev/vite-plus-darwin-x64@0.3.3'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@0.3.3'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@0.3.3'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@0.3.3'
  - '@voidzero-dev/vite-plus-linux-x64-musl@0.3.3'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@0.3.3'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@0.3.3'
  - vite-plus@0.3.3
  - pathstrider@0.0.1
packages:
  - 'packages/*'
